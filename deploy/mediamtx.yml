# MediaMTX 配置：从相机拉 RTSP，转封装后以 WebRTC 发给遥控端。
#
# 设计依据见 docs/media-architecture.md。要点：不转码，相机上直接配好码流参数，
# 这里只做转封装，CPU 几乎不占也没有二次编码损失。
#
# 安全：MediaMTX 默认监听全部网卡并开五种协议。本机装有 4G，这是不可接受的
# 暴露面，所以关掉用不到的协议，RTSP 和 API 只绑 127.0.0.1。
# WebRTC 是唯一对外的一路，它要同时服务 MESH 和 2.4G 两个网段，没法绑单一地址，
# 改用 ICE 候选白名单把 4G 排除在外 —— 见下面 webrtc 一节。
# 改这些地址前先想清楚 4G 那侧能不能够到。

logLevel: info
logDestinations: [stdout]

# --- 协议开关 ---------------------------------------------------------------
# 只留 WebRTC。RTSP 服务端留着是为了本机调试和日后转码回推，同样绑到本地。

rtmp: no
hls: no
srt: no
moq: no
playback: no

rtsp: yes
rtspTransports: [tcp]
rtspAddress: 127.0.0.1:8554        # 仅本机，遥控端不经 RTSP

webrtc: yes
# 遥控端有两条链路，落在**两个互不可达的网段**上：
#   MESH  → eth1，192.168.10.0/24
#   2.4G  → 机身交换机上的 2.4G 接收机 → eth0，192.168.1.0/24
# MediaMTX 只能配一个监听地址，绑死其中一个会让另一条链路完全拉不到流
# （现场表现：控制正常、画面一直停在「等待拉流」）。所以这里监听全部网卡，
# 再用下面的 ipsFromInterfacesList 把 ICE 候选限定在内网口上 —— 4G（wwan0）
# 的地址不会出现在候选里。要更严的话在 wwan0 上用防火墙挡掉 8889/8189。
# 来龙去脉见 docs/media-architecture.md 第六节「webrtc_base 必须按客户端算」。
webrtcAddress: :8889
webrtcEncryption: no               # 内网链路，且 MESH 本身有加密
webrtcLocalUDPAddress: :8189
# UDP 不通时还能靠 TCP 候选建连。2.4G 这类窄链路上 UDP 未必畅通，
# 而只有 UDP 候选时 ICE 失败的样子和「拉不到流」一模一样，查起来很费劲。
webrtcLocalTCPAddress: :8189

# ICE 只用本地候选。这是个封闭内网，没有 NAT 要穿，
# 配 STUN 服务器反而会在没有外网时拖慢建连。
# 候选按网口取，而不是写死一个地址：写死就只有那一条链路能建连。
# wlan0 留着是为了台面联调（板子还没接进机身网时走 WiFi）。wwan0 刻意不列。
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList: [eth0, eth1, wlan0]
webrtcAdditionalHosts: []
webrtcICEServers2: []

api: yes
apiAddress: 127.0.0.1:9997         # 仅本机，供网关探活

# --- 媒体路径 ---------------------------------------------------------------
# path 名字要与 deploy/media.json 里的 path 一一对应，改一处就要改两处。
#
# sourceOnDemand: yes 表示没人看时不去拉流。这条很重要 ——
# 三路相机常年拉着会白白占用 eth1 带宽和 CPU，而实际同时只看一路。

pathDefaults:
  sourceOnDemand: yes
  sourceOnDemandCloseAfter: 10s

paths:
  ptz_vis_main:
    source: rtsp://admin:PASSWORD@192.168.10.12:554/Streaming/Channels/101
  ptz_vis_sub:
    source: rtsp://admin:PASSWORD@192.168.10.12:554/Streaming/Channels/102

  ptz_ir_main:
    source: rtsp://admin:PASSWORD@192.168.10.12:554/Streaming/Channels/201
  ptz_ir_sub:
    source: rtsp://admin:PASSWORD@192.168.10.12:554/Streaming/Channels/202

  # 机身相机。现场确认走 RTSP，直接转封装，不需要 ROS 桥接也不需要编码。
  #
  # 注意它在**狗那侧的网段**（eth0，192.168.1.x），不是载荷网段。
  # 拉流走 eth0、发流走 eth1，两条路互不干扰。
  #
  # 路径名 /test 像是出厂默认，换固件或改配置后可能变。取不到流时
  # 先用 tools/rtsp_probe.sh 重新探一遍，别急着怀疑网络。
  dog_cam_main:
    source: rtsp://192.168.1.105:8554/test

  # 机身相机只有这一路，没有子码流，所以 media.json 里也不给它配 sub。
  # 后果是它不被选为主视图时不可观看 —— 这是有意的：
  # 让一路 2 Mbps 的流去充当"缩略图"会当场击穿 MESH 的带宽预算。
  # 真要缩略图，得在这里用 runOnDemand 起一路 ffmpeg 转码，见
  # docs/media-architecture.md「转码兜底」。

  # 对讲上行：遥控端浏览器 WebRTC publish 到这个路径，
  # 再由 RK3588 上的 ffmpeg 拉出来写声卡。见 docs/media-architecture.md 第七节。
  talkback:
    source: publisher
    sourceOnDemand: no   # MediaMTX v1.20+ 不允许 publisher 继承 on-demand，否则进程退出
